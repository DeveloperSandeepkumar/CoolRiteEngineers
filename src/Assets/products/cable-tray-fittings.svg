<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
    <defs>
      <!-- Background Gradients -->
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0A192F" />
        <stop offset="50%" stop-color="#0c233c" />
        <stop offset="100%" stop-color="#1E293B" />
      </linearGradient>
      <!-- Grid Pattern -->
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      </pattern>
    </defs>

    <!-- Background Base -->
    <rect width="800" height="600" fill="url(#bgGrad)"/>
    <rect width="800" height="600" fill="url(#grid)"/>

    <!-- Subtle Technical Border -->
    <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(242, 171, 38, 0.25)" stroke-width="2" stroke-dasharray="16,8"/>

    <!-- Top Technical Header -->
    <g transform="translate(45, 55)">
      <rect x="0" y="0" width="140" height="28" rx="14" fill="rgba(242, 171, 38, 0.2)" stroke="#f2ab26" stroke-width="1"/>
      <text x="70" y="19" fill="#f2ab26" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">ELECTRICAL</text>
      <text x="160" y="20" fill="#94a3b8" font-family="monospace" font-size="12">DOC: CRE-PRD-2026</text>
    </g>

    <!-- Dynamic Graphic Element -->
    
        <!-- Perforated Cable Tray 3D Structure -->
        <g transform="translate(70, 30)">
          <!-- Main Tray Channel -->
          <polygon points="100,160 460,110 560,150 200,200" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
          <polygon points="100,160 200,200 200,280 100,240" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
          <polygon points="200,200 560,150 560,230 200,280" fill="#64748b" stroke="#334155" stroke-width="2"/>
          <!-- Perforated Slots on Base -->
          <g fill="#1e293b">
            <ellipse cx="280" cy="180" rx="12" ry="5" transform="rotate(-10 280 180)"/>
            <ellipse cx="320" cy="175" rx="12" ry="5" transform="rotate(-10 320 175)"/>
            <ellipse cx="360" cy="170" rx="12" ry="5" transform="rotate(-10 360 170)"/>
            <ellipse cx="400" cy="165" rx="12" ry="5" transform="rotate(-10 400 165)"/>
            <ellipse cx="440" cy="160" rx="12" ry="5" transform="rotate(-10 440 160)"/>
            <ellipse cx="480" cy="155" rx="12" ry="5" transform="rotate(-10 480 155)"/>
          </g>
          <!-- 90 Degree Bend Segment Connected -->
          <polygon points="100,240 40,320 120,380 200,280" fill="#475569" stroke="#f2ab26" stroke-width="2"/>
          <!-- Fish Plate Splice Joint -->
          <rect x="185" y="230" width="30" height="55" rx="4" fill="#f2ab26" stroke="#0A2540" stroke-width="2"/>
          <circle cx="200" cy="245" r="4" fill="#0A2540"/>
          <circle cx="200" cy="270" r="4" fill="#0A2540"/>
        </g>
      

    <!-- Bottom Info Panel -->
    <g transform="translate(45, 490)">
      <rect x="0" y="0" width="710" height="65" rx="10" fill="rgba(10, 37, 64, 0.85)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <text x="24" y="28" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">Cable Tray Bends, Tees & Crosses</text>
      <text x="24" y="48" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="13">Prefabricated Cable Routing Fittings</text>
      
      <!-- Right Compliance Badge -->
      <rect x="530" y="15" width="160" height="35" rx="6" fill="#f2ab26"/>
      <text x="610" y="38" fill="#0A2540" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">IEC 61537</text>
    </g>
  </svg>