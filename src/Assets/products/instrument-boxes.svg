<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
    <defs>
      <!-- Background Gradients -->
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0A192F" />
        <stop offset="50%" stop-color="#0c233c" />
        <stop offset="100%" stop-color="#1E293B" />
      </linearGradient>
      <!-- Grid Pattern -->
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      </pattern>
    </defs>

    <!-- Background Base -->
    <rect width="800" height="600" fill="url(#bgGrad)"/>
    <rect width="800" height="600" fill="url(#grid)"/>

    <!-- Subtle Technical Border -->
    <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(242, 171, 38, 0.25)" stroke-width="2" stroke-dasharray="16,8"/>

    <!-- Top Technical Header -->
    <g transform="translate(45, 55)">
      <rect x="0" y="0" width="140" height="28" rx="14" fill="rgba(242, 171, 38, 0.2)" stroke="#f2ab26" stroke-width="1"/>
      <text x="70" y="19" fill="#f2ab26" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">ELECTRICAL</text>
      <text x="160" y="20" fill="#94a3b8" font-family="monospace" font-size="12">DOC: CRE-PRD-2026</text>
    </g>

    <!-- Dynamic Graphic Element -->
    
        <!-- Industrial Electrical Panel Enclosure -->
        <rect x="200" y="100" width="400" height="360" rx="14" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>
        <!-- Inner Door Recess -->
        <rect x="220" y="120" width="360" height="320" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
        <!-- Hinges & 3-Point Handle -->
        <rect x="194" y="150" width="8" height="30" rx="2" fill="#0A2540"/>
        <rect x="194" y="380" width="8" height="30" rx="2" fill="#0A2540"/>
        <rect x="545" y="240" width="16" height="60" rx="4" fill="#0A2540" stroke="#f2ab26" stroke-width="2"/>
        <circle cx="553" cy="260" r="4" fill="#f2ab26"/>
        <!-- Indicator Pilot Lights R-Y-B -->
        <circle cx="270" cy="150" r="10" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
        <circle cx="310" cy="150" r="10" fill="#eab308" stroke="#ffffff" stroke-width="2"/>
        <circle cx="350" cy="150" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
        <!-- Voltmeter / Ammeter Display -->
        <rect x="420" y="135" width="120" height="40" rx="4" fill="#0A2540" stroke="#38bdf8" stroke-width="2"/>
        <text x="480" y="160" fill="#38bdf8" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">415 V</text>
        <!-- Louvered Air Vents -->
        <path d="M260 380 H340 M260 390 H340 M260 400 H340 M260 410 H340" stroke="#64748b" stroke-width="3"/>
        <!-- Caution Hazard Badge -->
        <polygon points="460,400 480,365 500,400" fill="#eab308" stroke="#0A2540" stroke-width="2"/>
        <text x="480" y="395" fill="#0A2540" font-size="14" font-family="sans-serif" text-anchor="middle" font-weight="900">!</text>
      

    <!-- Bottom Info Panel -->
    <g transform="translate(45, 490)">
      <rect x="0" y="0" width="710" height="65" rx="10" fill="rgba(10, 37, 64, 0.85)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <text x="24" y="28" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">Process Instrument Protective Housings</text>
      <text x="24" y="48" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="13">SS 304 Transmitter & Sensor Boxes</text>
      
      <!-- Right Compliance Badge -->
      <rect x="530" y="15" width="160" height="35" rx="6" fill="#f2ab26"/>
      <text x="610" y="38" fill="#0A2540" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">IP65 FLAMEPROOF</text>
    </g>
  </svg>