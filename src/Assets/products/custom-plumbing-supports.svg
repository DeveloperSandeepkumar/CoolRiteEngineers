<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
    <defs>
      <!-- Background Gradients -->
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0A192F" />
        <stop offset="50%" stop-color="#0c233c" />
        <stop offset="100%" stop-color="#1E293B" />
      </linearGradient>
      <!-- Grid Pattern -->
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      </pattern>
    </defs>

    <!-- Background Base -->
    <rect width="800" height="600" fill="url(#bgGrad)"/>
    <rect width="800" height="600" fill="url(#grid)"/>

    <!-- Subtle Technical Border -->
    <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(242, 171, 38, 0.25)" stroke-width="2" stroke-dasharray="16,8"/>

    <!-- Top Technical Header -->
    <g transform="translate(45, 55)">
      <rect x="0" y="0" width="140" height="28" rx="14" fill="rgba(242, 171, 38, 0.2)" stroke="#f2ab26" stroke-width="1"/>
      <text x="70" y="19" fill="#f2ab26" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">PLUMBING</text>
      <text x="160" y="20" fill="#94a3b8" font-family="monospace" font-size="12">DOC: CRE-PRD-2026</text>
    </g>

    <!-- Dynamic Graphic Element -->
    
        <!-- Heavy Duty Rubber Lined Split Pipe Clamp & Clevis -->
        <g transform="translate(180, 70)">
          <!-- Top Threaded Rod & Nut M10/M12 -->
          <rect x="210" y="20" width="20" height="90" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
          <rect x="195" y="70" width="50" height="20" rx="3" fill="#f2ab26" stroke="#0A2540" stroke-width="2"/>
          <!-- Top Clamp Half -->
          <path d="M70 200 A150 150 0 0 1 370 200" fill="none" stroke="#64748b" stroke-width="32" stroke-linecap="round"/>
          <path d="M70 200 A150 150 0 0 1 370 200" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
          <!-- Bottom Clamp Half -->
          <path d="M70 200 A150 150 0 0 0 370 200" fill="none" stroke="#64748b" stroke-width="32" stroke-linecap="round"/>
          <path d="M70 200 A150 150 0 0 0 370 200" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
          <!-- Inner Pipe Section -->
          <circle cx="220" cy="200" r="115" fill="#38bdf8" stroke="#0284c7" stroke-width="4"/>
          <!-- Side Fastener Bolts with Washers -->
          <rect x="40" y="185" width="40" height="30" rx="4" fill="#f2ab26" stroke="#0A2540" stroke-width="2"/>
          <rect x="360" y="185" width="40" height="30" rx="4" fill="#f2ab26" stroke="#0A2540" stroke-width="2"/>
        </g>
      

    <!-- Bottom Info Panel -->
    <g transform="translate(45, 490)">
      <rect x="0" y="0" width="710" height="65" rx="10" fill="rgba(10, 37, 64, 0.85)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <text x="24" y="28" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">Manifold Headers & Pump Skids</text>
      <text x="24" y="48" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="13">Pressure Tested Distribution Manifolds</text>
      
      <!-- Right Compliance Badge -->
      <rect x="530" y="15" width="160" height="35" rx="6" fill="#f2ab26"/>
      <text x="610" y="38" fill="#0A2540" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">25 BAR TESTED</text>
    </g>
  </svg>