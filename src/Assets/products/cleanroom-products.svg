<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
    <defs>
      <!-- Background Gradients -->
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0A192F" />
        <stop offset="50%" stop-color="#0c233c" />
        <stop offset="100%" stop-color="#1E293B" />
      </linearGradient>
      <!-- Grid Pattern -->
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      </pattern>
    </defs>

    <!-- Background Base -->
    <rect width="800" height="600" fill="url(#bgGrad)"/>
    <rect width="800" height="600" fill="url(#grid)"/>

    <!-- Subtle Technical Border -->
    <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(242, 171, 38, 0.25)" stroke-width="2" stroke-dasharray="16,8"/>

    <!-- Top Technical Header -->
    <g transform="translate(45, 55)">
      <rect x="0" y="0" width="140" height="28" rx="14" fill="rgba(242, 171, 38, 0.2)" stroke="#f2ab26" stroke-width="1"/>
      <text x="70" y="19" fill="#f2ab26" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">HVAC</text>
      <text x="160" y="20" fill="#94a3b8" font-family="monospace" font-size="12">DOC: CRE-PRD-2026</text>
    </g>

    <!-- Dynamic Graphic Element -->
    
        <!-- Precision Sheet Metal Component / Cabinet -->
        <g transform="translate(100, 40)">
          <!-- 3D Formed Enclosure -->
          <polygon points="120,160 440,110 520,170 200,220" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
          <polygon points="120,160 200,220 200,350 120,290" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
          <polygon points="200,220 520,170 520,300 200,350" fill="#64748b" stroke="#334155" stroke-width="2"/>
          <!-- CNC Press Brake Bends & Stiffeners -->
          <line x1="130" y1="175" x2="190" y2="218" stroke="#f2ab26" stroke-width="3"/>
          <line x1="130" y1="275" x2="190" y2="335" stroke="#f2ab26" stroke-width="3"/>
          <!-- Ventilation Slots & Louver Cutouts -->
          <line x1="240" y1="240" x2="340" y2="225" stroke="#1e293b" stroke-width="4"/>
          <line x1="240" y1="260" x2="340" y2="245" stroke="#1e293b" stroke-width="4"/>
          <line x1="240" y1="280" x2="340" y2="265" stroke="#1e293b" stroke-width="4"/>
          <line x1="240" y1="300" x2="340" y2="285" stroke="#1e293b" stroke-width="4"/>
          <!-- Heavy Duty Stainless Steel Toggle Latch -->
          <rect x="440" y="210" width="25" height="45" rx="3" fill="#f2ab26" stroke="#0A2540" stroke-width="2"/>
          <circle cx="452" cy="230" r="4" fill="#0A2540"/>
        </g>
      

    <!-- Bottom Info Panel -->
    <g transform="translate(45, 490)">
      <rect x="0" y="0" width="710" height="65" rx="10" fill="rgba(10, 37, 64, 0.85)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <text x="24" y="28" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">Cleanroom Dynamic Pass Boxes</text>
      <text x="24" y="48" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="13">SS 304 Interlocking Pass Boxes & LAF</text>
      
      <!-- Right Compliance Badge -->
      <rect x="530" y="15" width="160" height="35" rx="6" fill="#f2ab26"/>
      <text x="610" y="38" fill="#0A2540" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ISO 14644 CLASS 5</text>
    </g>
  </svg>