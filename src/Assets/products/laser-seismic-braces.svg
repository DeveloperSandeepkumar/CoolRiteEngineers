<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
    <defs>
      <!-- Background Gradients -->
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0A192F" />
        <stop offset="50%" stop-color="#0c233c" />
        <stop offset="100%" stop-color="#1E293B" />
      </linearGradient>
      <!-- Grid Pattern -->
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      </pattern>
    </defs>

    <!-- Background Base -->
    <rect width="800" height="600" fill="url(#bgGrad)"/>
    <rect width="800" height="600" fill="url(#grid)"/>

    <!-- Subtle Technical Border -->
    <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(242, 171, 38, 0.25)" stroke-width="2" stroke-dasharray="16,8"/>

    <!-- Top Technical Header -->
    <g transform="translate(45, 55)">
      <rect x="0" y="0" width="140" height="28" rx="14" fill="rgba(242, 171, 38, 0.2)" stroke="#f2ab26" stroke-width="1"/>
      <text x="70" y="19" fill="#f2ab26" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">LASER CUTTING</text>
      <text x="160" y="20" fill="#94a3b8" font-family="monospace" font-size="12">DOC: CRE-PRD-2026</text>
    </g>

    <!-- Dynamic Graphic Element -->
    
        <!-- CNC Laser Cutting Head & Intricate Metal Profiles -->
        <g transform="translate(100, 30)">
          <!-- Heavy Steel Plate with Cut Profile -->
          <polygon points="80,240 420,180 540,240 200,300" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
          <polygon points="80,240 200,300 200,380 80,320" fill="#334155" stroke="#1e293b" stroke-width="2"/>
          <polygon points="200,300 540,240 540,320 200,380" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
          <!-- Laser Cut Precision Gear / Flange Geometry -->
          <circle cx="300" cy="230" r="50" fill="#0f172a" stroke="#f2ab26" stroke-width="3" stroke-dasharray="8,4"/>
          <circle cx="300" cy="230" r="20" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
          <circle cx="280" cy="230" r="5" fill="#f2ab26"/>
          <circle cx="320" cy="230" r="5" fill="#f2ab26"/>
          <circle cx="300" cy="210" r="5" fill="#f2ab26"/>
          <circle cx="300" cy="250" r="5" fill="#f2ab26"/>
          <!-- Fiber Laser Torch Head -->
          <polygon points="285,60 315,60 305,150 295,150" fill="#0A2540" stroke="#f2ab26" stroke-width="2"/>
          <rect x="280" y="20" width="40" height="50" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
          <!-- High Energy Focused Laser Beam & Glow -->
          <line x1="300" y1="150" x2="300" y2="230" stroke="#38bdf8" stroke-width="4"/>
          <line x1="300" y1="150" x2="300" y2="230" stroke="#ffffff" stroke-width="2"/>
          <!-- Cutting Sparks & Plasma Burst -->
          <circle cx="300" cy="230" r="14" fill="#fbbf24" opacity="0.8"/>
          <path d="M300 230 L270 200 M300 230 L330 210 M300 230 L280 260 M300 230 L325 255 M300 230 L255 225 M300 230 L345 240" stroke="#f59e0b" stroke-width="2"/>
        </g>
      

    <!-- Bottom Info Panel -->
    <g transform="translate(45, 490)">
      <rect x="0" y="0" width="710" height="65" rx="10" fill="rgba(10, 37, 64, 0.85)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <text x="24" y="28" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">Laser Cut Seismic Sway Brace Plates</text>
      <text x="24" y="48" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="13">Earthquake Restraint Attachment Clips</text>
      
      <!-- Right Compliance Badge -->
      <rect x="530" y="15" width="160" height="35" rx="6" fill="#f2ab26"/>
      <text x="610" y="38" fill="#0A2540" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">NFPA 13 SEISMIC</text>
    </g>
  </svg>