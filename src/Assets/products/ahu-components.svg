<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
    <defs>
      <!-- Background Gradients -->
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0A192F" />
        <stop offset="50%" stop-color="#0c233c" />
        <stop offset="100%" stop-color="#1E293B" />
      </linearGradient>
      <!-- Grid Pattern -->
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      </pattern>
    </defs>

    <!-- Background Base -->
    <rect width="800" height="600" fill="url(#bgGrad)"/>
    <rect width="800" height="600" fill="url(#grid)"/>

    <!-- Subtle Technical Border -->
    <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(242, 171, 38, 0.25)" stroke-width="2" stroke-dasharray="16,8"/>

    <!-- Top Technical Header -->
    <g transform="translate(45, 55)">
      <rect x="0" y="0" width="140" height="28" rx="14" fill="rgba(242, 171, 38, 0.2)" stroke="#f2ab26" stroke-width="1"/>
      <text x="70" y="19" fill="#f2ab26" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">HVAC</text>
      <text x="160" y="20" fill="#94a3b8" font-family="monospace" font-size="12">DOC: CRE-PRD-2026</text>
    </g>

    <!-- Dynamic Graphic Element -->
    
        <!-- AHU Unit Body -->
        <rect x="140" y="130" width="520" height="280" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4"/>
        <rect x="150" y="140" width="240" height="260" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
        <rect x="410" y="140" width="240" height="260" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
        <!-- Inspection Doors & Hinges -->
        <circle cx="165" cy="270" r="8" fill="#0A2540"/>
        <circle cx="425" cy="270" r="8" fill="#0A2540"/>
        <rect x="136" y="180" width="8" height="24" rx="2" fill="#475569"/>
        <rect x="136" y="320" width="8" height="24" rx="2" fill="#475569"/>
        <rect x="396" y="180" width="8" height="24" rx="2" fill="#475569"/>
        <rect x="396" y="320" width="8" height="24" rx="2" fill="#475569"/>
        <!-- Centrifugal Fan Impeller View -->
        <circle cx="270" cy="270" r="80" fill="#0A2540" stroke="#38bdf8" stroke-width="3"/>
        <circle cx="270" cy="270" r="30" fill="#1e293b" stroke="#f2ab26" stroke-width="3"/>
        <path d="M270 190 L270 350 M190 270 L350 270 M213 213 L327 327 M213 327 L327 213" stroke="#64748b" stroke-width="3"/>
        <!-- Cooling Coil Fins -->
        <rect x="430" y="160" width="200" height="220" rx="4" fill="#1e293b"/>
        <path d="M440 170 H620 M440 190 H620 M440 210 H620 M440 230 H620 M440 250 H620 M440 270 H620 M440 290 H620 M440 310 H620 M440 330 H620 M440 350 H620 M440 370 H620" stroke="#38bdf8" stroke-width="3"/>
        <!-- Base Channel Skid -->
        <rect x="120" y="410" width="560" height="30" rx="4" fill="#0A2540" stroke="#f2ab26" stroke-width="2"/>
        <circle cx="160" cy="425" r="6" fill="#f2ab26"/>
        <circle cx="640" cy="425" r="6" fill="#f2ab26"/>
      

    <!-- Bottom Info Panel -->
    <g transform="translate(45, 490)">
      <rect x="0" y="0" width="710" height="65" rx="10" fill="rgba(10, 37, 64, 0.85)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <text x="24" y="28" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">AHU Components</text>
      <text x="24" y="48" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="13">Double Skin Thermal Panels & Fan Blowers</text>
      
      <!-- Right Compliance Badge -->
      <rect x="530" y="15" width="160" height="35" rx="6" fill="#f2ab26"/>
      <text x="610" y="38" fill="#0A2540" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">EUROVENT / IS</text>
    </g>
  </svg>