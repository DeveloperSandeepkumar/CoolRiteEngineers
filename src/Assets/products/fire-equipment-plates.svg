<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
    <defs>
      <!-- Background Gradients -->
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0A192F" />
        <stop offset="50%" stop-color="#0c233c" />
        <stop offset="100%" stop-color="#1E293B" />
      </linearGradient>
      <!-- Grid Pattern -->
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      </pattern>
    </defs>

    <!-- Background Base -->
    <rect width="800" height="600" fill="url(#bgGrad)"/>
    <rect width="800" height="600" fill="url(#grid)"/>

    <!-- Subtle Technical Border -->
    <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(242, 171, 38, 0.25)" stroke-width="2" stroke-dasharray="16,8"/>

    <!-- Top Technical Header -->
    <g transform="translate(45, 55)">
      <rect x="0" y="0" width="140" height="28" rx="14" fill="rgba(242, 171, 38, 0.2)" stroke="#f2ab26" stroke-width="1"/>
      <text x="70" y="19" fill="#f2ab26" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">FIRE FIGHTING</text>
      <text x="160" y="20" fill="#94a3b8" font-family="monospace" font-size="12">DOC: CRE-PRD-2026</text>
    </g>

    <!-- Dynamic Graphic Element -->
    
        <!-- Fire Hose Reel Cabinet & Hydrant Valve -->
        <rect x="200" y="100" width="400" height="360" rx="12" fill="#dc2626" stroke="#991b1b" stroke-width="4"/>
        <rect x="220" y="120" width="360" height="320" rx="8" fill="#b91c1c" stroke="#fca5a5" stroke-width="2"/>
        <!-- Circular Fire Hose Reel -->
        <circle cx="340" cy="270" r="95" fill="#dc2626" stroke="#ffffff" stroke-width="4"/>
        <circle cx="340" cy="270" r="45" fill="#991b1b" stroke="#facc15" stroke-width="3"/>
        <circle cx="340" cy="270" r="15" fill="#ffffff"/>
        <!-- Coiled Red Hose Lines -->
        <circle cx="340" cy="270" r="70" fill="none" stroke="#f87171" stroke-width="10" stroke-dasharray="15,6"/>
        <!-- Brass Fog Nozzle -->
        <polygon points="440,240 480,225 480,255" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
        <!-- Fire Extinguisher Bracket Beside -->
        <rect x="480" y="170" width="55" height="190" rx="26" fill="#dc2626" stroke="#ffffff" stroke-width="3"/>
        <rect x="495" y="145" width="25" height="30" fill="#0A2540"/>
        <path d="M495 155 H475 V180" fill="none" stroke="#0A2540" stroke-width="6" stroke-linecap="round"/>
        <!-- Chrome Slam Lock Handle -->
        <circle cx="245" cy="270" r="10" fill="#ffffff" stroke="#0A2540" stroke-width="2"/>
      

    <!-- Bottom Info Panel -->
    <g transform="translate(45, 490)">
      <rect x="0" y="0" width="710" height="65" rx="10" fill="rgba(10, 37, 64, 0.85)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <text x="24" y="28" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">Fire Pump Equipment Base Skids</text>
      <text x="24" y="48" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="13">Heavy Structural Steel Mounting Plates</text>
      
      <!-- Right Compliance Badge -->
      <rect x="530" y="15" width="160" height="35" rx="6" fill="#f2ab26"/>
      <text x="610" y="38" fill="#0A2540" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">NFPA 20 STANDARD</text>
    </g>
  </svg>